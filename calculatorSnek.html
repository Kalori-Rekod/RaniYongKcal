<!DOCTYPE html>
<html lang="ms"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Snek</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="p-6">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">🥨 Kalkulator Snek</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Kiri & Tengah: Senarai Item -->
            <div class="lg:col-span-2 space-y-4">
                <h2 class="text-lg font-semibold text-gray-700">10 Kuih Teratas</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="items-container">
                    <!-- Items populated by JavaScript -->
                </div>
            </div>

            <!-- Kanan: Snek Dipilih Sidebar -->
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 flex flex-col justify-between h-fit min-h-[500px]">
                <div>
                    <h2 class="text-lg font-bold text-gray-800 mb-4">Snek dipilih</h2>
                    
                    <!-- Selected List -->
                    <div id="selected-list" class="space-y-2 max-h-[250px] overflow-y-auto mb-4">
                        <!-- Selected items dynamically listed here -->
                    </div>
                </div>

                <!-- Summary Breakdown & Action Box -->
                <div class="space-y-4 pt-4 border-t border-gray-200">
                    <div class="grid grid-cols-2 gap-2 text-sm text-gray-600">
                        <div class="bg-white p-2 rounded border border-gray-200">
                            <p class="text-xs text-gray-400">Karbo</p>
                            <p class="font-bold text-gray-800" id="total-carbs">0 g</p>
                        </div>
                        <div class="bg-white p-2 rounded border border-gray-200">
                            <p class="text-xs text-gray-400">Protein</p>
                            <p class="font-bold text-gray-800" id="total-protein">0 g</p>
                        </div>
                        <div class="bg-white p-2 rounded border border-gray-200">
                            <p class="text-xs text-gray-400">Lemak</p>
                            <p class="font-bold text-gray-800" id="total-fat">0 g</p>
                        </div>
                        <div class="bg-white p-2 rounded border border-gray-200">
                            <p class="text-xs text-gray-400">Item</p>
                            <p class="font-bold text-gray-800" id="total-items">0</p>
                        </div>
                    </div>

                    <!-- Total Kcal Container (Bulat Merah) -->
                    <div class="flex justify-between items-center bg-white p-3 rounded-lg border-2 border-red-500 font-bold text-lg">
                        <span class="text-gray-700">Total Kcal</span>
                        <span class="text-gray-900" id="total-kcal">0</span>
                    </div>

                    <!-- Buttons -->
                    <button id="btn-copy" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 px-4 rounded-lg transition-colors cursor-pointer text-center text-sm">
                        Copy Total Kcal
                    </button>
                    
                    <button id="btn-clear" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg transition-colors cursor-pointer text-center text-sm">
                        Kosongkan pilihan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="snek.js"></script>
</body>
</html>
