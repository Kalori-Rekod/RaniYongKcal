<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Snek</title>
    <!-- Menggunakan Tailwind CSS v4 untuk antaramuka responsif dan kemas -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="p-4 md:p-6 bg-gray-50 min-h-screen">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md p-6">
        <!-- Tajuk Utama -->
        <h1 class="text-2xl font-bold text-gray-800 mb-2 flex items-center gap-2">🥨 Kalkulator Snek</h1>
        <p class="text-xs text-gray-500 mb-6">Cari terus daripada database GAS. Default: 10 jenis kuih teratas.</p>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- BAHAGIAN KIRI: Carian & Senarai Kuih -->
            <div class="lg:col-span-2 space-y-4">
                <!-- Bar Carian -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">⌕</span>
                    <input type="text" id="search-input" placeholder="Cari nama kuih atau ID snek..." 
                           class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-400 bg-white">
                </div>

                <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">10 Kuih Teratas</h2>
                <!-- Tempat Kad Snek Dipaparkan -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="items-container">
                    <!-- Ditjana oleh JavaScript -->
                </div>
            </div>

            <!-- BAHAGIAN KANAN: Kalkulator Snek Dipilih -->
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 flex flex-col justify-between min-h-[500px]">
                <div>
                    <h2 class="text-lg font-bold text-gray-800 mb-1">Snek dipilih</h2>
                    <p class="text-xs text-gray-400 mb-4">Tekan mana-mana snek untuk pilih.</p>
                    <!-- Tempat Item Dipilih Dipaparkan -->
                    <div id="selected-list" class="space-y-2 max-h-[250px] overflow-y-auto mb-4">
                        <!-- Ditjana oleh JavaScript -->
                    </div>
                </div>

                <!-- Rumusan Makronutrien & Butang Aksi -->
                <div class="space-y-4 pt-4 border-t border-gray-200">
                    <div class="grid grid-cols-2 gap-2 text-sm text-gray-600">
                        <div class="bg-white p-2 rounded border border-gray-200">
                            <p class="text-xs text-gray-400">Karbo</p>
                            <p class="font-bold text-gray-800" id="total-carbs">0 g</p>
                        </div>
                        <div class="bg-white p-2 rounded border border-gray-200">
                            <p class="text-xs text-gray-400">Protein</p>
                            <p class="font-bold text-gray-800" id="total-protein">0 g</p>
                        </div>
                        <div class="bg-white p-2 rounded border border-gray-200">
                            <p class="text-xs text-gray-400">Lemak</p>
                            <p class="font-bold text-gray-800" id="total-fat">0 g</p>
                        </div>
                        <div class="bg-white p-2 rounded border border-gray-200">
                            <p class="text-xs text-gray-400">Item</p>
                            <p class="font-bold text-gray-800" id="total-items">0</p>
                        </div>
                    </div>

                    <!-- KOTAK BULAT MERAH (Auto-kira Total Kcal) -->
                    <div class="flex justify-between items-center bg-white p-3 rounded-lg border-2 border-red-500 font-bold text-lg">
                        <span class="text-gray-700">Total Kcal</span>
                        <span class="text-gray-900" id="total-kcal">0</span>
                    </div>

                    <!-- Butang Ditukar Menjadi Copy Total Kcal -->
                    <button id="btn-copy" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 px-4 rounded-lg transition-colors cursor-pointer text-sm text-center">
                        Copy Total Kcal
                    </button>
                    
                    <button id="btn-clear" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg transition-colors cursor-pointer text-sm text-center">
                        Kosongkan pilihan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIK JAVASCRIPT APLIKASI -->
    <script>
        // Pangkalan Data Contoh Snek Tradisional Malaysia (Anggaran Makro Piawai)
        const databaseKuih = [
            { id: "SNK001", nama: "Kuih Seri Muka", carbs: 35, protein: 3, fat: 4 },
            { id: "SNK002", nama: "Kuih Lapis", carbs: 21, protein: 1, fat: 3 },
            { id: "SNK003", nama: "Karipap Pusing", carbs: 18, protein: 4, fat: 7 },
            { id: "SNK004", nama: "Onde-Onde (Buah Melaka)", carbs: 25, protein: 2, fat: 5 },
            { id: "SNK005", nama: "Kuih Talam Gula Merah", carbs: 28, protein: 2, fat: 4 },
            { id: "SNK006", font: "", nama: "Bingka Ubi", carbs: 32, protein: 2, fat: 6 },
            { id: "SNK007", nama: "Kuih Kaswi", carbs: 22, protein: 1, fat: 2 },
            { id: "SNK008", nama: "Cekodok Pisang", carbs: 24, protein: 2, fat: 5 },
            { id: "SNK009", nama: "Popia Goreng", carbs: 15, protein: 3, fat: 6 },
            { id: "SNK010", nama: "Kuih Lopes", carbs: 30, protein: 2, fat: 3 }
        ];

        let selectedItems = [];

        // Hubungan Elemen DOM
        const itemsContainer = document.getElementById("items-container");
        const selectedList = document.getElementById("selected-list");
        const searchInput = document.getElementById("search-input");
        
        const totalCarbsEl = document.getElementById("total-carbs");
        const totalProteinEl = document.getElementById("total-protein");
        const totalFatEl = document.getElementById("total-fat");
        const totalItemsEl = document.getElementById("total-items");
        const totalKcalEl = document.getElementById("total-kcal");
        
        const btnCopy = document.getElementById("btn-copy");
        const btnClear = document.getElementById("btn-clear");

        // Formula Makronutrien Rasmi: (Carbs * 4) + (Protein * 4) + (Fat * 9)
        function hitungKaloriItem(carbs, protein, fat) {
            return (carbs * 4) + (protein * 4) + (fat * 9);
        }

        // Fungsi Memaparkan Senarai Kuih Beserta Butiran Makronutrien & Total Kcal Asal
        function renderItems(filterText = "") {
            itemsContainer.innerHTML = "";
            
            // Logik Penapisan Carian (Menyokong carian nama atau ID snek)
            const filtered = databaseKuih.filter(item => 
                item.nama.toLowerCase().includes(filterText.toLowerCase()) || 
                item.id.toLowerCase().includes(filterText.toLowerCase())
            );

            if(filtered.length === 0) {
                itemsContainer.innerHTML = `<p class="text-sm text-gray-400 col-span-2 text-center py-4">Tiada snek dijumpai.</p>`;
                return;
            }

            filtered.forEach(item => {
                const kcalAsal = hitungKaloriItem(item.carbs, item.protein, item.fat);
                const card = document.createElement("div");
                card.className = "bg-white p-4 rounded-lg border border-gray-200 shadow-sm hover:shadow transition-shadow cursor-pointer flex justify-between items-center";
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-gray-800 text-sm">${item.nama}</h3>
                        <p class="text-[11px] text-gray-400 mt-0.5">ID: ${item.id}</p>
                        <p class="text-[11px] text-gray-500 mt-2">C ${item.carbs}g · P ${item.protein}g · F ${item.fat}g</p>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-slate-700 text-sm">${kcalAsal} kcal</p>
                    </div>
                `;
                // Apabila kad diklik, ia dimasukkan ke kalkulator pilihan
                card.addEventListener("click", () => tambahKePilihan(item));
                itemsContainer.appendChild(card);
            });
        }

        // Logik Tambah Item
        function tambahKePilihan(item) {
            selectedItems.push(item);
            updateUI();
        }

        // Logik Buang Item
        function buangDariPilihan(index) {
            selectedItems.splice(index, 1);
            updateUI();
        }

        // Logik Kiraan Automatik Sebelah Kanan (Kalkulator Snek)
        function updateUI() {
            selectedList.innerHTML = "";
            let totalCarbs = 0, totalProtein = 0, totalFat = 0;
            
            if (selectedItems.length === 0) {
                selectedList.innerHTML = `<p class="text-xs text-gray-400 py-2">Belum ada snek dipilih.</p>`;
            }

            selectedItems.forEach((item, index) => {
                totalCarbs += item.carbs;
                totalProtein += item.protein;
                totalFat += item.fat;
                
                const kcalItem = hitungKaloriItem(item.carbs, item.protein, item.fat);
                const selectedBlock = document.createElement("div");
                selectedBlock.className = "bg-white p-2.5 rounded-lg border border-gray-200 flex justify-between items-center text-xs shadow-sm";
                selectedBlock.innerHTML = `
                    <div>
                        <p class="font-bold text-gray-800">${item.nama}</p>
                        <p class="text-[10px] text-gray-400 mt-0.5">${kcalItem} kcal · C ${item.carbs}g · P ${item.protein}g · F ${item.fat}g</p>
                    </div>
                    <button class="text-gray-400 hover:text-red-500 font-bold p-1 cursor-pointer text-base line-height-0" data-index="${index}">&times;</button>
                `;
                
                selectedBlock.querySelector("button").addEventListener("click", (e) => {
                    buangDariPilihan(parseInt(e.target.getAttribute("data-index")));
                });
                selectedList.appendChild(selectedBlock);
            });
            
            // Kira Jumlah Keseluruhan Kalori daripada pengumpulan makro snek dipilih
            const totalKcal = hitungKaloriItem(totalCarbs, totalProtein, totalFat);
            
            // Kemaskini teks paparan statistik kalkulator
            totalCarbsEl.innerText = `${totalCarbs} g`;
            totalProteinEl.innerText = `${totalProtein} g`;
            totalFatEl.innerText = `${totalFat} g`;
            totalItemsEl.innerText = selectedItems.length;
            totalKcalEl.innerText = totalKcal;
        }

        // Jalankan fungsi tapisan semasa input ditaip
        searchInput.addEventListener("input", (e) => {
            renderItems(e.target.value);
        });

        // Logik Fungsi Butang Menyalin (Copy Total Kcal) ke Clipboard Sistem
        btnCopy.addEventListener("click", () => {
            const nilaiKcal = totalKcalEl.innerText;
            
            navigator.clipboard.writeText(nilaiKcal).then(() => {
                const textAsal = btnCopy.innerText;
                
                // Maklum balas visual (Butang bertukar warna hijau sukses)
                btnCopy.innerText = "✓ Copied!";
                btnCopy.classList.replace("bg-slate-900", "bg-emerald-600");
                btnCopy.classList.replace("hover:bg-slate-800", "hover:bg-emerald-500");
                
                setTimeout(() => {
                    btnCopy.innerText = textAsal;
                    btnCopy.classList.replace("bg-emerald-600", "bg-slate-900");
                    btnCopy.classList.replace("hover:bg-emerald-500", "hover:bg-slate-800");
                }, 1500);
            }).catch(err => {
                alert("Gagal menyalin teks: " + err);
            });
        });

        // Kosongkan semua pilihan snek tertera
        btnClear.addEventListener("click", () => {
            selectedItems = [];
            updateUI();
        });

        // Panggilan Permulaan (Initial Load)
        renderItems();
        updateUI();
    </script>
</body>
</html>
