<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Snek</title>
    <style>
        :root {
            --primary: #4a5568;
            --accent: #dd6b20;
            --bg: #f7fafc;
            --card: #ffffff;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        h1, h2 {
            margin-top: 0;
            color: #2d3748;
        }
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: var(--accent);
        }
        .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            cursor: pointer;
        }
        .snek-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .snek-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .snek-item:last-child {
            border-bottom: none;
        }
        .snek-item:hover {
            background-color: #f7fafc;
        }
        .snek-info .name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .snek-info .serving {
            font-size: 12px;
            color: #718096;
        }
        .snek-kcal {
            font-weight: bold;
            color: var(--accent);
        }
        .selected-box {
            border: 2px dashed #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            background-color: #fffaf0;
            border-color: #fbd38d;
        }
        .selected-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding: 4px 0;
        }
        .remove-btn {
            color: #e53e3e;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
        }
        .macro-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .macro-card {
            background: #edf2f7;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .macro-label {
            font-size: 12px;
            color: #4a5568;
            margin-bottom: 4px;
        }
        .macro-value {
            font-weight: bold;
            font-size: 18px;
        }
        .total-kcal-box {
            background: #feebc8;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            color: #c05621;
            margin-bottom: 16px;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-copy {
            background-color: #edf2f7;
            color: #2d3748;
        }
        .btn-copy:hover {
            background-color: #e2e8f0;
        }
        .btn-clear {
            background-color: #e53e3e;
            color: white;
        }
        .btn-clear:hover {
            background-color: #c53030;
        }
        .loading {
            padding: 20px;
            text-align: center;
            color: #718096;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🥨 Kalkulator Snek</h1>
    <p style="font-size: 14px; color: #718096; margin-top:-8px;">Cari terus daripada database GAS. Default: 10 jenis kuih teratas.</p>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari snek atau kuih...">
        <span class="search-icon" id="searchBtn">⌕</span>
    </div>

    <h2 id="listTitle" style="font-size: 18px; margin-bottom: 10px;">10 Kuih Teratas</h2>
    <div class="snek-list" id="snekList">
        <div class="loading">Memuatkan data dari Google Sheets...</div>
    </div>

    <div class="selected-box">
        <h2 style="font-size: 16px; margin-bottom: 8px;">Snek dipilih</h2>
        <div id="selectedItemsContainer">
            <div style="color: #a0aec0; font-size: 14px;">Tekan mana-mana snek untuk pilih.</div>
        </div>
    </div>

    <div class="macro-grid">
        <div class="macro-card">
            <div class="macro-label">Karbo</div>
            <div class="macro-value"><span id="totalCarbs">0</span> g</div>
        </div>
        <div class="macro-card">
            <div class="macro-label">Protein</div>
            <div class="macro-value"><span id="totalProtein">0</span> g</div>
        </div>
        <div class="macro-card">
            <div class="macro-label">Lemak</div>
            <div class="macro-value"><span id="totalFat">0</span> g</div>
        </div>
    </div>

    <div class="total-kcal-box">
        <span id="itemCount">0 Item</span> | Total Kcal: <span id="totalCalories">0</span>
    </div>

    <div class="btn-group">
        <button class="btn-copy" id="copyBtn">Copy Total Kcal</button>
        <button class="btn-clear" id="clearBtn">Kosongkan pilihan</button>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbwtJWh9oAxMqSr_Fs32n64puyFbhfhvuVecjO85eyzpNX4xRVTJBEZ39iR3zWOrVHqfKg/exec";

    let snekDatabase = [];
    let selectedSnekList = [];

    const searchInput = document.getElementById('searchInput');
    const snekListContainer = document.getElementById('snekList');
    const listTitle = document.getElementById('listTitle');
    const selectedItemsContainer = document.getElementById('selectedItemsContainer');
    
    const totalCarbsEl = document.getElementById('totalCarbs');
    const totalProteinEl = document.getElementById('totalProtein');
    const totalFatEl = document.getElementById('totalFat');
    const totalCaloriesEl = document.getElementById('totalCalories');
    const itemCountEl = document.getElementById('itemCount');

    // Load initial 10 items
    async function loadInitialSnek() {
        if(API_URL === "SILA_GANTIKAN_DENGAN_URL_WEB_APP_ANDA") {
            snekListContainer.innerHTML = '<div class="loading" style="color:#e53e3e;">Sila konfigurasi API_URL dalam file HTML terlebih dahulu.</div>';
            return;
        }
        try {
            const response = await fetch(`${API_URL}?api=searchSnek`);
            const data = await response.json();
            if (data.status === "success") {
                snekDatabase = data.data || [];
                renderSnekList(snekDatabase);
            } else {
                snekListContainer.innerHTML = `<div class="loading">Gagal memuatkan data: ${data.message}</div>`;
            }
        } catch (error) {
            snekListContainer.innerHTML = '<div class="loading">Ralat sambungan ke server GAS.</div>';
            console.error(error);
        }
    }

    // Search function
    async function searchSnek(query) {
        snekListContainer.innerHTML = '<div class="loading">Mencari...</div>';
        try {
            const response = await fetch(`${API_URL}?api=searchSnek&q=${encodeURIComponent(query)}`);
            const data = await response.json();
            if (data.status === "success") {
                snekDatabase = data.data || [];
                listTitle.innerText = query ? `Hasil Carian (${snekDatabase.length})` : "10 Kuih Teratas";
                renderSnekList(snekDatabase);
            }
        } catch (error) {
            snekListContainer.innerHTML = '<div class="loading">Ralat semasa carian.</div>';
        }
    }

    // Render list to UI
    function renderSnekList(items) {
        if (items.length === 0) {
            snekListContainer.innerHTML = '<div class="loading">Tiada snek ditemui.</div>';
            return;
        }
        snekListContainer.innerHTML = '';
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'snek-item';
            
            // Menggunakan property '.calories' hasil mapping daripada backend script secara betul
            div.innerHTML = `
                <div class="snek-info">
                    <div class="name">${item.name}</div>
                    <div class="serving">${item.serving || '1 hidangan'}</div>
                </div>
                <div class="snek-kcal">${item.calories} kcal</div>
            `;
            div.addEventListener('click', () => addSnekToSelection(item));
            snekListContainer.appendChild(div);
        });
    }

    // Add item to active selection
    function addSnekToSelection(item) {
        selectedSnekList.push(item);
        updateSelectionUI();
    }

    // Remove item from selection
    function removeSnekFromSelection(index) {
        selectedSnekList.splice(index, 1);
        updateSelectionUI();
    }

    // Recalculate totals and refresh UI
    function updateSelectionUI() {
        if (selectedSnekList.length === 0) {
            selectedItemsContainer.innerHTML = '<div style="color: #a0aec0; font-size: 14px;">Tekan mana-mana snek untuk pilih.</div>';
            totalCarbsEl.innerText = '0';
            totalProteinEl.innerText = '0';
            totalFatEl.innerText = '0';
            totalCaloriesEl.innerText = '0';
            itemCountEl.innerText = '0 Item';
            return;
        }

        selectedItemsContainer.innerHTML = '';
        let totalCalories = 0;
        let totalCarbs = 0;
        let totalProtein = 0;
        let totalFat = 0;

        selectedSnekList.forEach((item, index) => {
            totalCalories += Number(item.calories || 0);
            totalCarbs += Number(item.carbs || 0);
            totalProtein += Number(item.protein || 0);
            totalFat += Number(item.fat || 0);

            const div = document.createElement('div');
            div.className = 'selected-item';
            div.innerHTML = `
                <div style="font-size: 14px;">${item.name} (${item.calories} kcal)</div>
                <span class="remove-btn" data-index="${index}">&times;</span>
            `;
            
            div.querySelector('.remove-btn').addEventListener('click', (e) => {
                const idx = parseInt(e.target.getAttribute('data-index'));
                removeSnekFromSelection(idx);
            });
            
            selectedItemsContainer.appendChild(div);
        });

        // Round decimals nicely
        totalCaloriesEl.innerText = Math.round(totalCalories);
        totalCarbsEl.innerText = Math.round(totalCarbs);
        totalProteinEl.innerText = Math.round(totalProtein);
        totalFatEl.innerText = Math.round(totalFat);
        itemCountEl.innerText = `${selectedSnekList.length} Item`;
    }

    // Event Listeners
    let debounceTimer;
    searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        const query = e.target.value.trim();
        debounceTimer = setTimeout(() => {
            searchSnek(query);
        }, 400);
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
        searchSnek(searchInput.value.trim());
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
        selectedSnekList = [];
        updateSelectionUI();
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
        const textToCopy = totalCaloriesEl.innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert(`Total Kcal (${textToCopy}) berjaya disalin!`);
        }).catch(err => {
            console.error('Gagal menyalin teks: ', err);
        });
    });

    // Run setup
    loadInitialSnek();
</script>

</body>
</html>
