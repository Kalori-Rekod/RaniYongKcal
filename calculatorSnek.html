<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Snek</title>
    <style>
        :root {
            --primary: #d35400;
            --primary-hover: #e67e22;
            --background: #f9f9f9;
            --surface: #ffffff;
            --text: #2c3e50;
            --text-muted: #7f8c8d;
            --border: #e0e0e0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--background);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .search-box {
            position: relative;
            margin-bottom: 25px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: var(--primary);
        }
        .search-box .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .snack-list {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .snack-item {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .snack-item:last-child {
            border-bottom: none;
        }
        .snack-item:hover {
            background-color: #fff5ee;
        }
        .snack-info .name {
            font-weight: 600;
            font-size: 15px;
        }
        .snack-info .serving {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .snack-kcal {
            font-weight: 700;
            color: var(--primary);
            font-size: 15px;
        }
        .selected-section {
            background: #fdfefe;
            border: 1px dashed var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .selected-list {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        .selected-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 14px;
            border-bottom: 1px solid #f2f4f4;
        }
        .selected-item:last-child {
            border-bottom: none;
        }
        .selected-item .remove-btn {
            color: #e74c3c;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
            padding: 2px 5px;
        }
        .macro-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .macro-box {
            background: #f8f9fa;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .macro-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .macro-value {
            font-weight: 700;
            font-size: 16px;
        }
        .summary-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff5ee;
            border: 1px solid #fbdcce;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .summary-left .item-count {
            font-size: 13px;
            color: var(--text-muted);
        }
        .summary-left .total-kcal {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            margin-top: 2px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
        }
        .btn-secondary {
            background-color: #e0e0e0;
            color: var(--text);
        }
        .btn-secondary:hover {
            background-color: #d5d5d5;
        }
        .loading, .empty-msg {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🥨 Kalkulator Snek</h1>
    <div class="subtitle">Cari terus daripada database GAS. Default: 10 jenis kuih teratas.</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari snek atau jenis kuih...">
        <span class="search-icon">⌕</span>
    </div>

    <h2 id="listTitle">10 Kuih Teratas</h2>
    <div class="snack-list" id="snackList">
        <div class="loading">Memuatkan data dari Google Sheets...</div>
    </div>

    <div class="selected-section">
        <h2>Snek dipilih</h2>
        <div class="selected-list" id="selectedList">
            <div class="empty-msg" style="padding:0; text-align:left;">Tekan mana-mana snek untuk pilih.</div>
        </div>
    </div>

    <div class="macro-grid">
        <div class="macro-box">
            <div class="macro-label">Karbo</div>
            <div class="macro-value" id="totalCarbs">0 g</div>
        </div>
        <div class="macro-box">
            <div class="macro-label">Protein</div>
            <div class="macro-value" id="totalProtein">0 g</div>
        </div>
        <div class="macro-box">
            <div class="macro-label">Lemak</div>
            <div class="macro-value" id="totalFat">0 g</div>
        </div>
    </div>

    <div class="summary-box">
        <div class="summary-left">
            <div class="item-count"><span id="totalItems">0</span> Item</div>
            <div class="total-kcal">Total Kcal <span id="totalKcal">0</span></div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" id="copyBtn">Copy Total Kcal</button>
        <button class="btn btn-secondary" id="clearBtn">Kosongkan pilihan</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwtJWh9oAxMqSr_Fs32n64puyFbhfhvuVecjO85eyzpNX4xRVTJBEZ39iR3zWOrVHqfKg/exec";
    
    let allSnacks = [];
    let selectedSnacks = [];
    let debounceTimer;

    // Elements
    const searchInput = document.getElementById('searchInput');
    const snackList = document.getElementById('snackList');
    const listTitle = document.getElementById('listTitle');
    const selectedList = document.getElementById('selectedList');
    const totalCarbs = document.getElementById('totalCarbs');
    const totalProtein = document.getElementById('totalProtein');
    const totalFat = document.getElementById('totalFat');
    const totalItems = document.getElementById('totalItems');
    const totalKcal = document.getElementById('totalKcal');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');

    // Fetch initial 10 snacks on load
    async function fetchSnacks(query = "") {
        try {
            if (!query) {
                snackList.innerHTML = '<div class="loading">Memuatkan data dari Google Sheets...</div>';
            } else {
                snackList.innerHTML = '<div class="loading">Mencari...</div>';
            }

            const url = new URL(API_URL);
            url.searchParams.append('api', 'searchSnek');
            if (query) url.searchParams.append('q', query);

            const response = await fetch(url);
            const data = await response.json();

            if (data.status === "success") {
                allSnacks = data.results || [];
                renderSnackList(allSnacks);
                
                if (query) {
                    listTitle.textContent = `Hasil Carian (${allSnacks.length})`;
                } else {
                    listTitle.textContent = "10 Kuih Teratas";
                }
            } else {
                snackList.innerHTML = `<div class="empty-msg">Ralat: ${data.message}</div>`;
            }
        } catch (error) {
            console.error("Error fetching data:", error);
            snackList.innerHTML = '<div class="empty-msg">Gagal menghubungi API database. Cuba lagi.</div>';
        }
    }

    function renderSnackList(snacks) {
        if (snacks.length === 0) {
            snackList.innerHTML = '<div class="empty-msg">Tiada snek dijumpai.</div>';
            return;
        }

        snackList.innerHTML = snacks.map(snack => `
            <div class="snack-item" onclick="selectSnack('${snack.id}')">
                <div class="snack-info">
                    <div class="name">${snack.name}</div>
                    <div class="serving">${snack.serving ? snack.serving : '1 hidangan'} ${snack.category ? '• ' + snack.category : ''}</div>
                </div>
                <div class="snack-kcal">${snack.calories} kcal</div>
            </div>
        `).join('');
    }

    window.selectSnack = function(id) {
        const snack = allSnacks.find(s => s.id === id);
        if (!snack) return;

        selectedSnacks.push(snack);
        updateUI();
    };

    window.removeSelected = function(index) {
        selectedSnacks.splice(index, 1);
        updateUI();
    };

    function updateUI() {
        if (selectedSnacks.length === 0) {
            selectedList.innerHTML = '<div class="empty-msg" style="padding:0; text-align:left;">Tekan mana-mana snek untuk pilih.</div>';
            totalCarbs.textContent = '0 g';
            totalProtein.textContent = '0 g';
            totalFat.textContent = '0 g';
            totalItems.textContent = '0';
            totalKcal.textContent = '0';
            return;
        }

        selectedList.innerHTML = selectedSnacks.map((snack, index) => `
            <div class="selected-item">
                <span>${snack.name} (${snack.calories} kcal)</span>
                <span class="remove-btn" onclick="removeSelected(${index})">×</span>
            </div>
        `).join('');

        let carbs = 0, protein = 0, fat = 0, kcal = 0;
        selectedSnacks.forEach(s => {
            carbs += Number(s.carbs || 0);
            protein += Number(s.protein || 0);
            fat += Number(s.fat || 0);
            kcal += Number(s.calories || 0);
        });

        totalCarbs.textContent = `${carbs.toFixed(1).replace('.0', '')} g`;
        totalProtein.textContent = `${protein.toFixed(1).replace('.0', '')} g`;
        totalFat.textContent = `${fat.toFixed(1).replace('.0', '')} g`;
        totalItems.textContent = selectedSnacks.length;
        totalKcal.textContent = kcal;
    }

    // Event Listeners
    searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        const query = e.target.value.trim();
        debounceTimer = setTimeout(() => {
            fetchSnacks(query);
        }, 300);
    });

    clearBtn.addEventListener('click', () => {
        selectedSnacks = [];
        updateUI();
    });

    copyBtn.addEventListener('click', () => {
        const kcalText = totalKcal.textContent;
        if (kcalText === '0') {
            alert('Sila pilih snek terlebih dahulu.');
            return;
        }
        navigator.clipboard.writeText(`${kcalText} kcal`).then(() => {
            alert(`Berjaya disalin: ${kcalText} kcal`);
        }).catch(err => {
            console.error('Gagal menyalin teks: ', err);
        });
    });

    // Initial load
    fetchSnacks();
</script>

</body>
</html>
