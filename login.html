<!DOCTYPE html> 
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk - Kalori Kalkulator by ry</title>
    
    <!-- Enjin Tailwind CSS v4 Play CDN Rasmi -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Penyepaduan CSS Native untuk Tema Tersuai Rapat v4 -->
    <style type="text/tailwindcss">
        @theme {
            /* Menyelaraskan ton warna gelap konsisten dashboard */
            --color-bg-main: #12141c;
            --color-bg-card: #1a1d26;
            --color-bg-input: #242936;
            --color-border-custom: #2e3545;
            
            /* Warna aksen bertenaga */
            --color-brand-blue: #3b82f6;
            --color-brand-orange: #f97316;
        }
    </style>
</head>
<!-- Latar belakang gelap lembut yang serasi secara menyeluruh -->
<body class="bg-bg-main flex items-center justify-center min-h-screen px-4 font-sans text-gray-200 antialiased">

    <!-- Kad Log Masuk Kompak -->
    <div class="bg-bg-card p-8 rounded-2xl shadow-2xl w-full max-w-md border border-border-custom/60 transition-all duration-300 hover:border-border-custom">
        
        <!-- Tajuk & Logo Jenama -->
        <div class="text-center mb-8">
            <p class="text-gray-400 mt-4 text-sm font-medium">Sila log masuk ke akaun kalori anda.</p>
        </div>

        <!-- Borang Input Log Masuk -->
        <form id="loginForm" class="space-y-5">
            <!-- Ruang Nama Pengguna -->
            <div>
                <label for="username" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Nama Pengguna</label>
                <input 
                    type="text" 
                    id="username" 
                    required 
                    placeholder="Masukkan username anda" 
                    class="w-full bg-bg-input text-white px-4 py-3 rounded-xl border border-border-custom focus:ring-2 focus:ring-brand-blue focus:border-brand-blue outline-none transition duration-200 placeholder-gray-600 text-sm"
                >
            </div>

            <!-- Ruang Kata Laluan -->
            <div>
                <label for="password" class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Kata Laluan</label>
                <input 
                    type="password" 
                    id="password" 
                    required 
                    placeholder="••••••••" 
                    class="w-full bg-bg-input text-white px-4 py-3 rounded-xl border border-border-custom focus:ring-2 focus:ring-brand-blue focus:border-brand-blue outline-none transition duration-200 placeholder-gray-600 text-sm"
                >
            </div>

            <!-- Butang Hantar Pintar -->
            <button 
                type="submit" 
                class="w-full bg-brand-blue hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-xl transition duration-200 cursor-pointer transform active:scale-[0.98] shadow-lg shadow-blue-900/20 hover:shadow-blue-600/20"
            >
                Log Masuk
            </button>
        </form>

        <!-- Elemen Hiasan Palet Warna Dashboard -->
        <div class="flex justify-center gap-2 mt-8">
            <span class="w-3 h-1.5 rounded-full bg-brand-blue opacity-80"></span>
            <span class="w-3 h-1.5 rounded-full bg-emerald-500 opacity-80"></span>
            <span class="w-3 h-1.5 rounded-full bg-brand-orange opacity-80"></span>
            <span class="w-3 h-1.5 rounded-full bg-amber-500 opacity-80"></span>
        </div>

        <!-- Nota Kaki Hak Cipta -->

    </div>

    <!-- JavaScript Logik Penghalaan URL Utama (window.top) -->
    <script>
        // PASTE URL WEB APP GAS ANDA DI SINI.
        const GAS_API_URL = "PASTE_WEB_APP_URL_HERE";
        const AUTH_TOKEN_KEY = "kalori_auth_token";
        const AUTH_USER_KEY = "calorie_current_user";
        const NEXT_PAGE = "Wanie123.html";

        const form = document.getElementById("loginForm");
        const button = form.querySelector("button[type=submit]");

        function showError(message) {
            let box = document.getElementById("loginError");
            if (!box) {
                box = document.createElement("div");
                box.id = "loginError";
                box.className = "mt-4 text-center text-sm font-semibold text-red-400";
                form.appendChild(box);
            }
            box.textContent = message;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();
            showError("");

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!GAS_API_URL || GAS_API_URL.includes("PASTE_WEB_APP_URL_HERE")) {
                showError("URL Web App GAS belum dimasukkan.");
                return;
            }

            if (!username || !password) {
                showError("Sila masukkan username dan password.");
                return;
            }

            button.disabled = true;
            button.textContent = "Sedang log masuk...";

            try {
                const response = await fetch(GAS_API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "login",
                        username: username,
                        password: password
                    })
                });

                if (!response.ok) throw new Error("HTTP " + response.status);
                const data = await response.json();

                if (data.status !== "success") {
                    throw new Error(data.message || "Username atau password salah.");
                }

                localStorage.setItem(AUTH_TOKEN_KEY, data.token);
                localStorage.setItem(AUTH_USER_KEY, data.username);
                window.location.replace(NEXT_PAGE);
            } catch (error) {
                showError(error.message || "Login gagal. Sila cuba lagi.");
            } finally {
                button.disabled = false;
                button.textContent = "Log Masuk";
            }
        });
    </script>

</body>
</html>
