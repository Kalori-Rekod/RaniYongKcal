<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Calorie & Macronutrient Calculator by Rani Yong</title>
    <style>
        /* Reset default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f6f9;
        }

        /* Header Styles */
        header {
            background-color: #1a252f;
            color: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.25rem;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* Logout Button Style */
        .btn-logout {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: none; /* Disembunyikan secara lalai */
            transition: background 0.2s;
        }

        .btn-logout:hover {
            background-color: #c0392b;
        }

        /* Main Body Wrapper for Iframe */
        .iframe-container {
            flex: 1;
            width: 100%;
            position: relative;
        }

        /* Responsive Full-Screen Iframe */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Footer Styles */
        footer {
            background-color: #2c3e50;
            color: #bdc3c7;
            text-align: center;
            padding: 10px 20px;
            font-size: 0.85rem;
            z-index: 10;
        }

        /* Responsive text size for smaller screens */
        @media (max-width: 600px) {
            header {
                font-size: 1rem;
                padding: 12px 10px;
                flex-direction: column;
                gap: 10px;
            }
            footer {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <span>Daily Calorie & Macronutrient Calculator by Rani Yong</span>
        <!-- Tambah butang log keluar -->
        <button id="logoutBtn" class="btn-logout" onclick="triggerLogout()">Log Keluar</button>
    </header>

    <!-- App Body (Iframe Section) -->
    <div class="iframe-container">
        <iframe 
            id="myIframe"
            src="https://kalori-rekod.github.io/RaniYongKcal/login.html" 
            class="w-full h-screen border-none" 
            scrolling="auto">
        </iframe>
    </div>

    <!-- Footer Section -->
    <footer>
        &copy; 2026 Daily Calorie & Macronutrient Calculator by Rani Yong.
    </footer>

    <script>
        const loginUrl = "https://kalori-rekod.github.io/RaniYongKcal/login.html";
        const iframe = document.getElementById('myIframe');
        const logoutBtn = document.getElementById('logoutBtn');

        // Fungsi yang berjalan setiap kali iframe memuatkan halaman
        iframe.addEventListener('load', function() {
            try {
                // Mengambil URL semasa di dalam iframe
                const currentUrl = iframe.contentWindow.location.href;

                // Menyemak sama ada URL semasa mengandungi perkataan 'login.html'
                if (currentUrl.includes('login.html')) {
                    logoutBtn.style.display = 'none';  // Sembunyikan butang jika di page login
                } else {
                    logoutBtn.style.display = 'block'; // Tunjukkan butang untuk page lain
                }
            } catch (error) {
                // Jika pengguna pergi ke domain luar (Cross-Origin), pelayar akan sekat pembacaan URL.
                // Kita anggap pengguna sudah keluar dari sistem asal, jadi tunjukkan butang logout.
                logoutBtn.style.display = 'block';
            }
        });

        // Fungsi apabila butang log keluar ditekan
        function triggerLogout() {
            iframe.src = loginUrl;
            logoutBtn.style.display = 'none'; // Sembunyikan serta-merta selepas ditekan
        }
    </script>


</body>
</html>
