<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk - Kalori Kalkulator by ry</title>
    <!-- Menggunakan Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
</head>
<!-- Latar belakang gelap lembut (soft dark background) sepadan dengan gambar -->
<body class="bg-[#1e222b] flex items-center justify-center min-h-screen px-4 font-sans text-gray-200">

    <!-- Kad Log Masuk dengan warna latar belakang komponen gelap -->
    <div class="bg-[#171a21] p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-800">
        
        <!-- Tajuk & Logo -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-500 tracking-tight">
                Kalori <span class="text-orange-500">Kalkulator</span>
            </h1>
            <p class="text-xs text-gray-500 mt-1 font-medium">by ry</p>
            <p class="text-gray-400 mt-4 text-sm">Sila log masuk ke akaun kalori anda.</p>
        </div>

        <!-- Borang Log Masuk -->
        <form id="loginForm" class="space-y-5">
            <!-- Input Username -->
            <div>
                <label for="username" class="block text-sm font-semibold text-gray-400 mb-1">Nama Pengguna</label>
                <input 
                    type="text" 
                    id="username" 
                    required 
                    placeholder="Masukkan username" 
                    class="w-full bg-[#222733] text-white px-4 py-3 rounded-xl border border-gray-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition placeholder-gray-600"
                >
            </div>

            <!-- Input Password -->
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-400 mb-1">Kata Laluan</label>
                <input 
                    type="password" 
                    id="password" 
                    required 
                    placeholder="••••••••" 
                    class="w-full bg-[#222733] text-white px-4 py-3 rounded-xl border border-gray-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition placeholder-gray-600"
                >
            </div>

            <!-- Butang Log Masuk (Warna biru sepadan dengan butang 'Simpan Rekod') -->
            <button 
                type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 transform active:scale-95 shadow-lg shadow-blue-900/40"
            >
                Log Masuk
            </button>
        </form>

        <!-- Hiasan Palet Warna (Indikator Kecil Snek/Makan) -->
        <div class="flex justify-center gap-2 mt-8">
            <span class="w-3 h-1.5 rounded-full bg-blue-500"></span>
            <span class="w-3 h-1.5 rounded-full bg-green-500"></span>
            <span class="w-3 h-1.5 rounded-full bg-orange-500"></span>
            <span class="w-3 h-1.5 rounded-full bg-yellow-500"></span>
        </div>

        <!-- Nota kaki -->
        <div class="mt-4 text-center text-xs text-gray-600">
            &copy; 2026 Kalori Kalkulator by Rani Yong
        </div>
    </div>

    <!-- JavaScript Redirect Utama (window.top) -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); 
            
            const user = encodeURIComponent(document.getElementById('username').value.trim().toLowerCase());
            const pass = encodeURIComponent(document.getElementById('password').value.trim());
            
            if (user && pass) {
                // Memecah keluar dari iframe dan menukar URL utama browser
                window.top.location.href = '/' + user + '/' + pass + '.html';
            }
        });
    </script>

</body>
</html>
