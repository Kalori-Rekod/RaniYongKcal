<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Kalori</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Bekas utama untuk halaman */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Susunan Iframe memenuhi skrin */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Gaya Butang Menu 3 Garis (Hamburger Button) */
        .menu-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background-color: #333;
            border-radius: 8px;
            display: none; /* Disembunyikan secara lalai */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }

        .menu-btn:hover {
            background-color: #555;
        }

        /* Tiga garis melintang */
        .bar {
            width: 25px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
            transition: 0.3s;
        }

        /* Animasi bertukar menjadi 'X' apabila menu dibuka (Optional) */
        .menu-btn.open .bar:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }
        .menu-btn.open .bar:nth-child(2) {
            opacity: 0;
        }
        .menu-btn.open .bar:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Butang Menu 3 Garis -->
        <div id="hamburgerMenu" class="menu-btn" onclick="toggleMenu()">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <!-- Iframe anda -->
        <iframe id="myIframe" src="https://kalori-rekod.github.io/RaniYongKcal/login.html"></iframe>
    </div>

    <script>
        const iframe = document.getElementById('myIframe');
        const menuBtn = document.getElementById('hamburgerMenu');
        const loginUrl = "https://kalori-rekod.github.io/RaniYongKcal/login.html";

        // Fungsi yang berjalan setiap kali iframe selesai memuatkan halaman baru
        iframe.onload = function() {
            try {
                // Mendapatkan URL semasa di dalam iframe (jika sama domain)
                const currentUrl = iframe.contentWindow.location.href;

                // Jika URL semasa tidak sama dengan URL login, paparkan butang menu
                if (currentUrl !== loginUrl) {
                    menuBtn.style.display = 'flex';
                } else {
                    menuBtn.style.display = 'none';
                }
            } catch (error) {
                // Jika berlaku Cross-Origin Error (pautan luar / berbeza domain), 
                // ini bermakna halaman sudah bertukar dari pautan asal login.html.
                // Maka, kita paparkan butang menu secara automatik.
                console.log("Bertukar ke pautan domain berbeza. Papar butang menu.");
                menuBtn.style.display = 'flex';
            }
        };

        // Fungsi klik butang menu (Suaikan tindakan mengikut kehendak anda)
        function toggleMenu() {
            menuBtn.classList.toggle('open');
            
            // Contoh tindakan: Letakkan fungsi buka sidebar atau popup menu anda di sini
            alert("Butang menu diklik! Anda boleh letakkan fungsi buka menu anda di sini.");
        }
    </script>

</body>
</html>
