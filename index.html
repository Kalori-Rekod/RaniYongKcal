<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Calorie & Macronutrient Calculator by Rani Yong</title>
    <style>
        /* Reset default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f6f9;
        }

        /* Header Styles */
        header {
            background-color: #1a252f;
            color: #ffffff;
            padding: 15px 20px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* Main Body Wrapper for Iframe */
        .iframe-container {
            flex: 1;
            width: 100%;
            position: relative;
        }

        /* Responsive Full-Screen Iframe */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Footer Styles */
        footer {
            background-color: #2c3e50;
            color: #bdc3c7;
            text-align: center;
            padding: 10px 20px;
            font-size: 0.85rem;
            z-index: 10;
        }

        /* Responsive text size for smaller screens */
        @media (max-width: 600px) {
            header {
                font-size: 1rem;
                padding: 12px 10px;
            }
            footer {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        Daily Calorie & Macronutrient Calculator by Rani Yong
    </header>

    <!-- App Body (Iframe Section) -->
    <div class="iframe-container">
        <iframe 
            src="https://kalori-rekod.github.io/RaniYongKcal/login.html" 
            title="Rani Yong Calorie Calculator Login"
            sandbox="allow-same-origin allow-scripts allow-forms">
        </iframe>
    </div>

    <!-- Footer Section -->
    <footer>
        &copy; 2026 Daily Calorie & Macronutrient Calculator by Rani Yong.
    </footer>

</body>
</html>
